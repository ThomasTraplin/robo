<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Hall: Nerf Siege</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hud-wrap">
    <h1>Midnight Hall: Nerf Siege</h1>
    <div id="hud"></div>
    <div class="controls">
      <strong>Controls:</strong> WASD move · Mouse aim · Click shoot · E interact/barricade · F command nearby student · 1/2 switch floors at staircases.
    </div>
  </div>
  <canvas id="game" width="960" height="672"></canvas>
  <script src="game.js"></script>
</body>
</html>
